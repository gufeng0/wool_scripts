name: Sync Upstream Daily

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # 用可推送的 token，避免 GITHUB_TOKEN 限制触发不了后续 CI
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/fmz200/wool_scripts.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Merge upstream/main into main
        id: merge
        continue-on-error: true
        run: |
          git merge upstream/main --no-edit

      - name: Auto-resolve conflicts
        if: steps.merge.outcome == 'failure'
        run: |
          set -e
          echo "自动解决冲突中..."
          python3 << 'EOF'
          import re, subprocess, sys

          # fork 自定义意图：这些应用的规则保持禁用（注释掉上游新增/修改的行）
          DISABLE_KEYWORDS = [
              'caiyunapp',        # 彩云天气 activity 规则
          ]
          # 彩云天气区域冲突时，额外保留这条 fork 自有规则（上游没有）
          KEEP_LINES = ['DOMAIN,ad.cyapi.cn,REJECT']

          conflicts = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=U'],
              capture_output=True, text=True
          ).stdout.split()

          if not conflicts:
              sys.exit(1)

          for f in conflicts:
              src = open(f).read()
              def resolve(m):
                  head, upstream = m.group(1), m.group(2)
                  u = upstream.strip()
                  # 规则1：涉及禁用关键词时，取上游内容并注释掉，同时保留 fork 自有规则
                  if any(k in u for k in DISABLE_KEYWORDS):
                      body = u.replace('\n', '\n# ')
                      keep = '\n'.join(l for l in KEEP_LINES
                                       if l not in u and l not in head)
                      return ('# ' + body + ('\n' + keep if keep else '') + '\n')
                  # 规则2：HEAD 侧独有（上游没有）且在保留清单中的行 → 保留
                  if any(k in head for k in KEEP_LINES) and not any(k in u for k in KEEP_LINES):
                      return head.strip() + '\n'
                  # 规则3：默认取上游（fork 无自定义意图的区域跟随上游）
                  return u + '\n'
              src = re.sub(
                  r'<<<<<<< HEAD\n(.*?)\n=======\n(.*?)\n>>>>>>> [^\n]+\n',
                  resolve, src, flags=re.S
              )
              open(f, 'w').write(src)
              subprocess.run(['git', 'add', f], check=True)
              print(f'已解决: {f}')
          EOF

      - name: Commit merge result
        if: steps.merge.outcome == 'failure'
        run: |
          git commit --no-edit
          git log --oneline -1

      - name: Push to origin
        run: |
          git push origin main
